<div class="modal fade show d-block new-backdrop" *ngIf="isOpen" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden bg-white">
      
      <!-- Dark navy header (same as the Assessment Configuration Details popup) -->
      <div class="modal-header-custom px-4 py-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <span class="badge-seq-dark">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
            </svg>
          </span>
          <div>
            <h5 class="m-0 fw-bold text-white header-title">Add New Test Setup</h5>
            <span class="header-subtitle">Assign a new assessment to a candidate</span>
          </div>
        </div>
        <button type="button" class="btn-close-custom" aria-label="Close" (click)="close.emit()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
          </svg>
        </button>
      </div>

      <div class="modal-body p-4 new-body" [formGroup]="form">
        <!-- 1. Candidate lookup -->
        <div class="position-relative mb-3">
          <label class="field-label">Search &amp; Assign Candidate <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text themed-addon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg></span>
            <input type="text" class="form-control themed-input" [(ngModel)]="searchQuery" [ngModelOptions]="{standalone: true}" 
                   (keyup)="searchStudent()" placeholder="Type student name or ID to auto-populate...">
          </div>
          <div *ngIf="searchResults.length > 0" class="position-absolute w-100 bg-white shadow-lg border rounded-3 mt-1 z-3" style="max-height: 200px; overflow-y: auto;">
            <div *ngFor="let s of searchResults" (click)="selectStudent(s)" class="p-2 border-bottom hover-bg cursor-pointer d-flex justify-content-between">
              <span class="fw-semibold">{{ s.studentName }} ({{ s.studentId }})</span>
              <span class="text-muted small">{{ s.mobileNo }}</span>
            </div>
          </div>
        </div>

        <div class="row g-3 field-card-box p-3 rounded-3 mb-4 mx-0">
          <div class="col-md-3">
            <label class="field-label">Student Name</label>
            <input type="text" class="form-control themed-input themed-readonly" formControlName="studentName" readonly placeholder="Auto populated">
          </div>
          <div class="col-md-3">
            <label class="field-label">Student No</label>
            <input type="text" class="form-control themed-input themed-readonly" formControlName="studentNo" readonly placeholder="-">
          </div>
          <div class="col-md-3">
            <label class="field-label">Student ID</label>
            <input type="text" class="form-control themed-input themed-readonly" formControlName="studentId" readonly placeholder="-">
          </div>
          <div class="col-md-3">
            <label class="field-label">Mobile Number</label>
            <input type="text" class="form-control themed-input themed-readonly" formControlName="mobileNo" readonly placeholder="-">
          </div>
        </div>

        <!-- 2. Course & Test configuration -->
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="field-label">Course ID <span class="text-danger">*</span></label>
            <select class="form-select themed-input" formControlName="courseId">
              <option value="">- Select Course -</option>
              <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="field-label">Topic / Technology <span class="text-danger">*</span></label>
            <select class="form-select themed-input" formControlName="courseNo" [disabled]="!form.get('courseId')?.value">
              <option [ngValue]="null">- Select Tech -</option>
              <option *ngFor="let t of topics" [ngValue]="t.courseDetId">{{ t.topic }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="field-label">Course No (Auto)</label>
            <input type="text" class="form-control themed-input themed-readonly" [value]="form.get('courseNo')?.value || '-'" readonly>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="field-label">Test Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control themed-input" formControlName="testDate" [min]="todayDate">
          </div>
          <div class="col-md-4">
            <label class="field-label">Test No (Auto) <span class="text-danger">*</span></label>
            <input type="number" class="form-control themed-input themed-readonly fw-bold" style="color:#2563eb;" formControlName="testNo" readonly>
          </div>
          <div class="col-md-4">
            <label class="field-label">Level (1-3) <span class="text-danger">*</span></label>
            <select class="form-select themed-input" formControlName="lvl">
              <option [ngValue]="1">Level 1</option>
              <option [ngValue]="2">Level 2</option>
              <option [ngValue]="3">Level 3</option>
            </select>
          </div>
        </div>

<div class="row g-3 mb-3">
  <!-- Questions (Total No) -->
  <div class="col-md-6">
    <label class="field-label">Questions (Total No) </label>
    <input 
      type="number" 
      min="1" 
      class="form-control themed-input" 
      formControlName="noOfQuestions" 
      placeholder="e.g. 10">
  </div>

  <!-- Test-Timing -->
  <div class="col-md-6">
    <label class="field-label">Test-Timing </label>
    <div class="input-group">
      <input 
        type="number" 
        min="1" 
        class="form-control themed-input" 
        formControlName="timingValue" 
        placeholder="e.g. 30">
      <select class="form-select themed-input" style="max-width: 130px;" formControlName="timingUnit">
        <option [ngValue]="null" disabled selected>Min/Sec</option>
        <option value="MINS">Minutes</option>
        <option value="SECS">Seconds</option>
      </select>
    </div>
  </div>
</div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="field-label">Conducted By (Evaluator) <span class="text-danger">*</span></label>
            <select class="form-select themed-input" formControlName="testConductedBy">
              <option value="">- Select Evaluator -</option>
              <option *ngFor="let ev of evaluators" [value]="ev.id">{{ ev.trxnName }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="field-label">Entered By</label>
            <input type="text" class="form-control themed-input themed-readonly" value="admin" readonly>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer bg-light px-4 py-3 d-flex justify-content-between align-items-center border-top">
        <span class="text-muted small">Status: <strong class="status-active">● Active</strong></span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary rounded-pill px-4 fw-semibold" style="font-size: 0.85rem;" (click)="close.emit()">Cancel</button>
          <button type="button" class="btn-save rounded-pill px-4 fw-semibold" [disabled]="submitting" (click)="submit()">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span> Save Setup
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
