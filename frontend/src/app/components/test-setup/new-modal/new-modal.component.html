<div class="modal fade show d-block" *ngIf="isOpen" tabindex="-1" style="background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow-2xl rounded-4 overflow-hidden">
      
      <!-- Green Header -->
      <div class="modal-header text-white p-3 px-4 d-flex justify-content-between align-items-center" style="background-color: #15803d;">
        <h5 class="modal-title fs-5 fw-bold m-0">Add New Test Setup</h5>
        <button type="button" class="btn-close btn-close-white" (click)="close.emit()"></button>
      </div>

      <div class="modal-body p-4" [formGroup]="form">
        <!-- 1. Candidate lookup -->
        <div class="position-relative mb-3">
          <label class="form-label fw-semibold small text-muted">SEARCH & ASSIGN CANDIDATE <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" [(ngModel)]="searchQuery" [ngModelOptions]="{standalone: true}" 
                   (keyup)="searchStudent()" placeholder="Type student name or ID to auto-populate...">
          </div>
          <div *ngIf="searchResults.length > 0" class="position-absolute w-100 bg-white shadow-lg border rounded-3 mt-1 z-3" style="max-height: 200px; overflow-y: auto;">
            <div *ngFor="let s of searchResults" (click)="selectStudent(s)" class="p-2 border-bottom hover-bg cursor-pointer d-flex justify-content-between">
              <span class="fw-semibold">{{ s.studentName }} ({{ s.studentId }})</span>
              <span class="text-muted small">{{ s.mobileNo }}</span>
            </div>
          </div>
        </div>

        <div class="row g-3 bg-light p-3 rounded-3 mb-4 border">
          <div class="col-md-3">
            <label class="form-label small text-muted">Student Name</label>
            <input type="text" class="form-control bg-white" formControlName="studentName" readonly placeholder="Auto populated">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Student No</label>
            <input type="text" class="form-control bg-white" formControlName="studentNo" readonly placeholder="-">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Student ID</label>
            <input type="text" class="form-control bg-white" formControlName="studentId" readonly placeholder="-">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted">Mobile Number</label>
            <input type="text" class="form-control bg-white" formControlName="mobileNo" readonly placeholder="-">
          </div>
        </div>

        <!-- 2. Course & Test configuration -->
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Course ID <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="courseId">
              <option value="">- Select Course -</option>
              <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label fw-semibold small">Topic / Technology <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="courseNo" [disabled]="!form.get('courseId')?.value">
              <option [ngValue]="null">- Select Tech -</option>
              <option *ngFor="let t of topics" [ngValue]="t.courseDetId">{{ t.topic }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Course No (Auto)</label>
            <input type="text" class="form-control bg-light" [value]="form.get('courseNo')?.value || '-'" readonly>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Test Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" formControlName="testDate" [min]="todayDate">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Test No (Auto) <span class="text-danger">*</span></label>
            <input type="number" class="form-control bg-light fw-bold text-primary" formControlName="testNo" readonly>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Level (1-3) <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="lvl">
              <option [ngValue]="1">Level 1</option>
              <option [ngValue]="2">Level 2</option>
              <option [ngValue]="3">Level 3</option>
            </select>
          </div>
        </div>

<div class="row g-3 mb-3">
  <!-- Questions (Total No) -->
  <div class="col-md-6">
    <label class="form-label fw-semibold small text-secondary">Questions (Total No) </label>
    <input 
      type="number" 
      min="1" 
      class="form-control form-control-sm" 
      formControlName="noOfQuestions" 
      placeholder="e.g. 10">
  </div>

  <!-- Test-Timing -->
  <div class="col-md-6">
    <label class="form-label fw-semibold small text-secondary">Test-Timing </label>
    <div class="input-group input-group-sm">
      <input 
        type="number" 
        min="1" 
        class="form-control" 
        formControlName="timingValue" 
        placeholder="e.g. 30">
      <select class="form-select" style="max-width: 110px;" formControlName="timingUnit">
        <option [ngValue]="null" disabled selected>Min/Sec</option>
        <option value="MINS">Minutes</option>
        <option value="SECS">Seconds</option>
      </select>
    </div>
  </div>
</div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Conducted By (Evaluator) <span class="text-danger">*</span></label>
            <select class="form-select" formControlName="testConductedBy">
              <option value="">- Select Evaluator -</option>
              <option *ngFor="let ev of evaluators" [value]="ev.id">{{ ev.trxnName }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Entered By</label>
            <input type="text" class="form-control bg-light" value="admin" readonly>
          </div>
        </div>
      </div>

      <!-- Footer matching Image 4 -->
      <div class="modal-footer bg-white px-4 py-3 d-flex justify-content-between align-items-center border-top">
        <span class="text-muted small">Status: <strong class="text-success">● Active</strong></span>
        <div class="d-flex gap-2">
          <button type="button" class="btn px-4 py-2 fw-semibold text-white" style="background-color: #1e293b;" (click)="close.emit()">Cancel</button>
          <button type="button" class="btn px-4 py-2 fw-bold text-white" style="background-color: #15803d;" [disabled]="submitting" (click)="submit()">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span> Save Setup
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
