<div class="modal-backdrop fade show" *ngIf="isOpen"></div>
<div class="modal d-block" *ngIf="isOpen" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-lg border-0 rounded-3 overflow-hidden">
      
      <!-- Blue Header Matching View Screen -->
      <div class="modal-header bg-primary text-white py-2 px-3 d-flex align-items-center justify-content-between">
        <h5 class="modal-title fs-6 fw-bold mb-0">Modify Test Setup #{{ record?.testNo }}</h5>
        <button type="button" class="btn-close btn-close-white ms-auto" (click)="close.emit()" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4 bg-light" [formGroup]="form">
        
        <!-- Candidate Details Strip -->
        <div class="card border-0 shadow-sm p-3 mb-3 bg-white rounded-3">
          <span class="text-muted small fw-bold text-uppercase tracking-wider">CANDIDATE INFORMATION</span>
          <div class="row g-2 mt-1">
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">Student Name</label>
              <input type="text" class="form-control form-control-sm bg-light text-dark fw-bold border-0" formControlName="studentName" readonly>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">Student No</label>
              <input type="text" class="form-control form-control-sm bg-light text-secondary border-0" formControlName="studentNo" readonly>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">Student ID</label>
              <input type="text" class="form-control form-control-sm bg-light text-secondary border-0" formControlName="studentId" readonly>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted mb-1">Mobile Number</label>
              <input type="text" class="form-control form-control-sm bg-light text-secondary border-0" formControlName="mobileNo" readonly>
            </div>
          </div>
        </div>

        <!-- Form Inputs Card (Structured 2-Column Grid) -->
        <div class="card border-0 shadow-sm p-3 mb-3 bg-white rounded-3">
          <span class="text-muted small fw-bold text-uppercase tracking-wider mb-2 d-block">TEST CONFIGURATION</span>
          
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Course ID</label>
              <select class="form-select form-select-sm" formControlName="courseId">
                <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Topic / Technology *</label>
              <select class="form-select form-select-sm" formControlName="courseNo">
                <option *ngFor="let t of topics" [ngValue]="t.courseDetId">{{ t.topic }}</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold small text-secondary">Test Date (Locked)</label>
              <input type="date" class="form-control form-control-sm bg-light" formControlName="testDate" readonly>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold small text-secondary">Test No (Locked)</label>
              <input type="number" class="form-control form-control-sm bg-light fw-bold" formControlName="testNo" readonly>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold small text-secondary">Level (1-3) *</label>
              <select class="form-select form-select-sm" formControlName="lvl">
                <option [ngValue]="1">Level 1</option>
                <option [ngValue]="2">Level 2</option>
                <option [ngValue]="3">Level 3</option>
              </select>
            </div>

            <!-- Questions & Test-Timing Row -->
<div class="row g-3 mb-3">
  <div class="col-md-6">
    <label class="form-label fw-semibold small text-secondary">Questions (Total No) *</label>
    <input 
      type="number" 
      min="1" 
      class="form-control form-control-sm" 
      formControlName="noOfQuestions">
  </div>

  <div class="col-md-6">
    <label class="form-label fw-semibold small text-secondary">Test-Timing *</label>
    <div class="input-group input-group-sm">
      <input 
        type="number" 
        min="1" 
        class="form-control" 
        formControlName="timingValue">
      <select class="form-select" style="max-width: 110px;" formControlName="timingUnit">
        <option value="MINS">Minutes</option>
        <option value="SECS">Seconds</option>
      </select>
    </div>
  </div>
</div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Conducted By (Evaluator) *</label>
              <select class="form-select form-select-sm" formControlName="testConductedBy">
                <option *ngFor="let ev of evaluators" [value]="ev.id">{{ ev.trxnName }}</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small text-secondary">Status *</label>
              <select class="form-select form-select-sm" formControlName="delFlag">
                <option value="A">Active</option>
                <option value="D">Deactivated</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <!-- Action Buttons Matching View Modal Dimensions -->
      <div class="modal-footer bg-white border-top py-2 px-3 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary btn-sm px-3 fw-medium" (click)="close.emit()">
          Cancel
        </button>
        <button type="button" class="btn btn-primary btn-sm px-4 fw-medium shadow-sm" [disabled]="submitting" (click)="submit()">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
          Update Setup
        </button>
      </div>

    </div>
  </div>
</div>
